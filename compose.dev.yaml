# Inicie com: docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  app:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
      - backend_target:/app/target
      - maven_cache:/root/.m2
  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
volumes:
  backend_target:
  maven_cache:
  frontend_node_modules:
  frontend_next:
