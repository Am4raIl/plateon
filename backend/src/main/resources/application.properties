spring.application.name=plateon
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos_mesa?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:plateon}
spring.datasource.password=${DB_PASSWORD:plateon}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health,info
logging.level.root=INFO
logging.pattern.level=%5p mesa=%X{numeroMesa:-} pedido=%X{pedidoId:-}
restaurante.fuso=America/Sao_Paulo
restaurante.hora-virada=04:00
restaurante.taxa-servico=10
restaurante.couvert=0.00
restaurante.rascunho-ttl-minutos=30
restaurante.atraso-margem-min=5
restaurante.jwt.segredo=${JWT_SECRET:}
restaurante.jwt.expiracao-horas=8
restaurante.seed.referencia=true
restaurante.imagens.diretorio=${PRODUCT_IMAGES_DIR:./data/product-images}
restaurante.cors-origins=${CORS_ORIGINS:}
