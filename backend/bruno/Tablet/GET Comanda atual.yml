info:
  name: GET Comanda atual
  type: http
  seq: 3


http:
  method: GET
  url: "{{base_url}}/mesa/comanda"

  auth:
    type: bearer
    token: "{{tablet_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) { bru.setVar('comanda_id', res.body.id); bru.setVar('total', res.body.total); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
