info:
  name: POST Abrir comanda
  type: http
  seq: 3


http:
  method: POST
  url: "{{base_url}}/admin/comandas"

  body:
    type: json
    data: |-
      {
        "mesaId": "{{mesa_id}}"
      }

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('comanda_id', res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
