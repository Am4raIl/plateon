info:
  name: GET Adicionais
  type: http
  seq: 7


http:
  method: GET
  url: "{{base_url}}/admin/adicionais"

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.length) bru.setVar('adicional_id', res.body[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
