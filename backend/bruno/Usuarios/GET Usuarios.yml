info:
  name: GET Usuarios
  type: http
  seq: 1


http:
  method: GET
  url: "{{base_url}}/admin/usuarios"

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.itens?.length) bru.setVar('usuario_id', res.body.itens[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
