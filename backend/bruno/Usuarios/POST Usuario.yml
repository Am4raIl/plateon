info:
  name: POST Usuario
  type: http
  seq: 3


http:
  method: POST
  url: "{{base_url}}/admin/usuarios"

  body:
    type: json
    data: |-
      {
        "nome": "Bruno Teste",
        "username": "bruno_teste",
        "senha": "senha12345",
        "papel": "GARCOM",
        "ativo": true
      }

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('usuario_id', res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
