info:
  name: GET Cardapio
  type: http
  seq: 2


http:
  method: GET
  url: "{{base_url}}/mesa/cardapio"

  auth:
    type: bearer
    token: "{{tablet_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body?.length) bru.setVar('produto_id', res.body[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
