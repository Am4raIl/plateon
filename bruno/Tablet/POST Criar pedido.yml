info:
  name: POST Criar pedido
  type: http
  seq: 4


http:
  method: POST
  url: "{{base_url}}/mesa/pedidos"

  auth:
    type: bearer
    token: "{{tablet_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) { bru.setVar('pedido_id', res.body.id); bru.setVar('versao', res.body.versao); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
