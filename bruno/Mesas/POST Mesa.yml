info:
  name: POST Mesa
  type: http
  seq: 3


http:
  method: POST
  url: "{{base_url}}/admin/mesas"

  body:
    type: json
    data: |-
      {
        "numero": 99,
        "capacidade": 4,
        "ativa": true
      }

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('mesa_nova_id', res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
