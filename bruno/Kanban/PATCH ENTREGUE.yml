info:
  name: PATCH ENTREGUE
  type: http
  seq: 5


http:
  method: PATCH
  url: "{{base_url}}/admin/kanban/{{pedido_id}}/status"

  body:
    type: json
    data: |-
      {
        "novoStatus": "ENTREGUE",
        "versao": {{versao}}
      }

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('versao', res.body.versao);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
