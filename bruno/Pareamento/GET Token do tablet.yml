info:
  name: GET Token do tablet
  type: http
  seq: 3


http:
  method: GET
  url: "{{base_url}}/dispositivos/pareamento/{{solicitacao_id}}"

  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('tablet_token', res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
