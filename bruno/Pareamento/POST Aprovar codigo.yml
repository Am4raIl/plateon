info:
  name: POST Aprovar codigo
  type: http
  seq: 2


http:
  method: POST
  url: "{{base_url}}/admin/dispositivos/pareamento/aprovar"

  body:
    type: json
    data: |-
      {
        "codigo": "{{codigo}}",
        "mesaId": "{{mesa_id}}"
      }

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('dispositivo_id', res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
