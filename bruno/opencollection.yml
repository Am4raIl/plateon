opencollection: 1.0.0

info:
  name: Plateon
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        req.setHeader('Accept', 'application/json');
        bru.setVar('base_url', bru.getEnvVar('base_url') || 'http://localhost:8081/api/v1');
        bru.setVar('admin_username', bru.getEnvVar('admin_username') || 'admin');
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
