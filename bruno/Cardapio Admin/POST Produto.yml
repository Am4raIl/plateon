info:
  name: POST Produto
  type: http
  seq: 3


http:
  method: POST
  url: "{{base_url}}/admin/produtos"

  body:
    type: json
    data: |-
      {
        "nome": "Produto Bruno",
        "descricao": "Criado pelo Bruno",
        "categoria": "ENTRADAS",
        "preco": 12.5,
        "imagemUrl": null,
        "estacao": "COZINHA",
        "tempoPreparoEstimadoMin": 10,
        "disponivel": true,
        "ativo": true
      }

  auth:
    type: bearer
    token: "{{jwt}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) bru.setVar('produto_novo_id', res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
