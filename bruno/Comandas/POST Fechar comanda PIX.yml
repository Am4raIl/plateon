info:
  name: POST Fechar comanda PIX
  type: http
  seq: 4


http:
  method: POST
  url: "{{base_url}}/admin/comandas/{{comanda_id}}/fechar"

  body:
    type: json
    data: |-
      {
        "pagamentos": [
          {
            "forma": "PIX",
            "valor": {{total}}
          }
        ],
        "removerTaxa": false,
        "forcar": false
      }

  auth:
    type: bearer
    token: "{{jwt}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
